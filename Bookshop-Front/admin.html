<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель - Книгарня</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Панель Адміністратора</a>
            <div class="d-flex">
                <a href="index.html" class="btn btn-outline-light btn-sm">В магазин</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Управління книгами</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addProductModal">
                + Додати книгу
            </button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Обкладинка</th>
                            <th>Назва</th>
                            <th>Ціна</th>
                            <th>Залишок</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-table">
                        <tr><td colspan="6" class="text-center">Завантаження...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Нова книга</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="add-product-form">
                        <div class="mb-3">
                            <label class="form-label">Назва книги</label>
                            <input type="text" class="form-control" id="prod-title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Опис</label>
                            <textarea class="form-control" id="prod-desc" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ціна (грн)</label>
                                <input type="number" step="0.01" class="form-control" id="prod-price" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Кількість на складі</label>
                                <input type="number" class="form-control" id="prod-stock" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Посилання на картинку (URL)</label>
                            <input type="text" class="form-control" id="prod-image">
                            <div class="form-text">Тимчасово вставляємо повне посилання з інтернету</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Зберегти книгу</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
