<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель - Книгарня</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Панель Адміністратора</a>
            <div class="d-flex">
                <a href="index.html" class="btn btn-outline-light btn-sm">В магазин</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="products-tab" data-bs-toggle="tab" data-bs-target="#products-pane" type="button" role="tab">📚 Управління книгами</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders-pane" type="button" role="tab">📦 Всі замовлення</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="categories-tab" data-bs-toggle="tab" data-bs-target="#categories" type="button" role="tab">📚 Жанри</button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabsContent">
            <div class="tab-pane fade" id="categories" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3 mt-3">
                    <h2>Управління жанрами</h2>
                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addCategoryModal">➕ Додати жанр</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Назва жанру</th>
                                <th>Дії</th>
                            </tr>
                        </thead>
                        <tbody id="admin-categories-table">
                            <tr><td colspan="3" class="text-center">Завантаження...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="tab-pane fade show active" id="products-pane" role="tabpanel" tabindex="0">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3>Книги в каталозі</h3>
                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addProductModal">
                        + Додати книгу
                    </button>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Обкладинка</th>
                                    <th>Назва</th>
                                    <th>Ціна</th>
                                    <th class="text-center">Залишок</th>
                                    <th>Дії</th>
                                </tr>
                            </thead>
                            <tbody id="admin-products-table">
                                <tr><td colspan="6" class="text-center">Завантаження...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="orders-pane" role="tabpanel" tabindex="0">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3>Замовлення клієнтів</h3>
                    <button class="btn btn-outline-primary btn-sm" onclick="loadAdminOrders()">🔄 Оновити</button>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Дата</th>
                                    <th>Товари</th>
                                    <th>Сума</th>
                                    <th>Статус</th>
                                    <th>Дії</th>
                                </tr>
                            </thead>
                            <tbody id="admin-orders-table">
                                <tr><td colspan="6" class="text-center">Завантаження...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Нова книга</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="add-product-form">
                        <div class="mb-3"><label class="form-label">Назва книги</label><input type="text" class="form-control" id="prod-title" required></div>
                        <div class="mb-3"><label class="form-label">Опис</label><textarea class="form-control" id="prod-desc" rows="3" required></textarea></div>
                        <div class="mb-3">
                            <label class="form-label">Автор</label>
                            <input type="text" class="form-control" id="prod-author" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Жанр (Категорія)</label>
                            <select class="form-select" id="prod-category" required>
                                <option value="">Завантаження жанрів...</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label">Ціна (грн)</label><input type="number" step="0.01" class="form-control" id="prod-price" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Кількість на складі</label><input type="number" class="form-control" id="prod-stock" required></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Обкладинка книги (Зображення)</label>
                            <input type="file" class="form-control" id="prod-image-file" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Зберегти книгу</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Редагувати книгу</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-product-form">
                        <input type="hidden" id="edit-prod-id">
                        
                        <div class="mb-3"><label class="form-label">Назва</label><input type="text" class="form-control" id="edit-prod-title" required></div>
                        <div class="mb-3"><label class="form-label">Опис</label><textarea class="form-control" id="edit-prod-desc" rows="3" required></textarea></div>
                        <div class="mb-3">
                            <label class="form-label">Автор</label>
                            <input type="text" class="form-control" id="edit-prod-author" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label">Ціна (грн)</label><input type="number" step="0.01" class="form-control" id="edit-prod-price" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Залишок</label><input type="number" class="form-control" id="edit-prod-stock" required></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Жанр (Категорія)</label>
                            <select class="form-select" id="edit-prod-category" required>
                                <option value="">Завантаження жанрів...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Нова обкладинка (залиште пустим, якщо не змінюєте)</label>
                            <input type="file" class="form-control" id="edit-prod-image-file" accept="image/*">
                            <input type="hidden" id="edit-prod-image-url"> 
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Зберегти зміни</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="add-category-form">
                <div class="modal-header">
                    <h5 class="modal-title">Новий жанр</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Назва жанру</label>
                        <input type="text" class="form-control" id="cat-name" required placeholder="Наприклад: Детектив">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                    <button type="submit" class="btn btn-primary">Зберегти</button>
                </div>
            </form>
        </div>
    </div>
</div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/header.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
