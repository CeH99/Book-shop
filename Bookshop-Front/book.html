<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга - Онлайн-Книгарня</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .book-details-container {
            display: flex;
            gap: 40px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .book-details-image {
            flex: 0 0 300px; /* Фіксована ширина для картинки */
        }
        .book-details-image img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .book-details-info {
            flex: 1;
        }
        .book-details-title {
            font-size: 32px;
            margin-bottom: 15px;
            color: #222;
        }
        .book-details-price {
            font-size: 28px;
            font-weight: bold;
            color: #c91818;
            margin-bottom: 20px;
        }
        .book-details-stock {
            font-size: 16px;
            margin-bottom: 25px;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        .in-stock { background: #d4edda; color: #155724; }
        .out-of-stock { background: #f8d7da; color: #721c24; }
        .book-details-desc {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
            white-space: pre-wrap; /* Зберігає абзаци з бази даних */
        }
        .btn-buy-large {
            padding: 15px 40px;
            font-size: 18px;
            background: #c91818;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-buy-large:hover { background: #a01313; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo"><a href="index.html">Книгарня<span>.</span></a></div>
            <nav class="main-nav">
                <a href="index.html">Каталог</a>
                <a href="login.html">Увійти</a>
                <a href="cart.html" class="cart-link">Кошик (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div id="single-book-container">
            <p style="text-align: center; font-size: 18px;">Завантаження інформації про книгу...</p>
        </div>
    </main>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/header.js"></script>
    <script src="js/book.js"></script>
</body>
</html>
