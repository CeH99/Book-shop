<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга - Онлайн-Книгарня</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .btn-wishlist-large {
            padding: 12px 20px;
            font-size: 24px;
            background: #fff;
            color: #c91818;
            border: 2px solid #eaeaea;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-wishlist-large:hover {
            border-color: #c91818;
            background: #fdf0f0;
            transform: translateY(-2px);
        }
        .book-details-container {
            display: flex;
            gap: 40px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .book-details-image {
            flex: 0 0 300px;
        }
        .book-details-image img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .book-details-info {
            flex: 1;
        }
        .book-details-title {
            font-size: 32px;
            margin-bottom: 15px;
            color: #222;
        }
        .book-details-price {
            font-size: 28px;
            font-weight: bold;
            color: #c91818;
            margin-bottom: 20px;
        }
        .book-details-stock {
            font-size: 16px;
            margin-bottom: 25px;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        .in-stock { background: #d4edda; color: #155724; }
        .out-of-stock { background: #f8d7da; color: #721c24; }
        .book-details-desc {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
            white-space: pre-wrap;
        }
        .btn-buy-large {
            padding: 15px 40px;
            font-size: 18px;
            background: #c91818;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-buy-large:hover { background: #a01313; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo"><a href="index.html">Книгарня<span>.</span></a></div>
            <nav class="main-nav">
                <a href="index.html">Каталог</a>
                <a href="login.html">Увійти</a>
                <a href="cart.html" class="cart-link">Кошик (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div id="single-book-container">
            <p style="text-align: center; font-size: 18px;">Завантаження інформації про книгу...</p>
        </div>

        <!-- Reviews section -->
        <div class="reviews-section" id="reviews-section" style="display: none; margin-top: 50px; border-top: 1px solid #eee; padding-top: 30px;">
            <h2>💬 Відгуки читачів (<span id="reviews-count">0</span>)</h2>

            <!-- Review form -->
            <div class="review-form-container" style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
                <h4 style="margin-top: 0; margin-bottom: 15px;">Залишити відгук</h4>
                <form id="add-review-form">
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">Ваша оцінка:</label>
                        <select id="review-rating" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 220px; outline: none;">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>
                            <option value="3">⭐⭐⭐ (3/5)</option>
                            <option value="2">⭐⭐ (2/5)</option>
                            <option value="1">⭐ (1/5)</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">Ваш коментар:</label>
                        <textarea id="review-text" rows="4" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; box-sizing: border-box; outline: none;" placeholder="Що ви думаєте про цю книгу? Поділіться своїми враженнями!" required></textarea>
                    </div>
                    <button type="submit" class="btn-buy" style="padding: 10px 25px; border: none; cursor: pointer;">Відправити відгук</button>
                </form>
            </div>

            <!-- Reviews list -->
            <div id="reviews-list">
                <p>Завантаження відгуків...</p>
            </div>
        </div>
    </main>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/header.js"></script>
    <script src="js/book.js"></script>
</body>
</html>
