<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик - Онлайн-Книгарня</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
    .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: #fff; border-radius: 8px; overflow: hidden; }
    .cart-table th { background: #f8f9fa; padding: 15px; text-align: left; color: #555; font-size: 14px; text-transform: uppercase; }
    .cart-table td { padding: 20px 15px; border-bottom: 1px solid #eee; vertical-align: middle; }
    
    .btn-remove { 
        padding: 6px 12px; 
        border: 1px solid #ff5f6d; 
        color: #ff5f6d; 
        background: transparent; 
        border-radius: 4px; 
        cursor: pointer; 
        font-weight: 600; 
        transition: all 0.2s; 
    }
    .btn-remove:hover { background: #ff5f6d; color: #fff; }

    .empty-cart { text-align: center; font-size: 18px; margin: 50px 0; color: #777; }
    
    .checkout-section { 
        background: #fff; 
        padding: 30px; 
        border-radius: 12px; 
        border: 1px solid #eee; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        margin-top: 20px;
    }
</style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo"><a href="index.html">Книгарня<span>.</span></a></div>
            <nav class="main-nav">
                <a href="index.html">Каталог</a>
                <a href="cart.html" class="active cart-link">Кошик (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <h1 class="section-title">Ваш кошик</h1>
        <div id="cart-container">
            </div>
    </main>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/header.js"></script>     
    <script src="js/cart.js"></script>
</body>
</html>
