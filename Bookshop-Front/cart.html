<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик - Онлайн-Книгарня</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .cart-table th, .cart-table td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        .cart-total { font-size: 24px; font-weight: bold; text-align: right; margin-bottom: 20px; }
        .checkout-btn { background: #28a745; color: white; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 4px; float: right; }
        .checkout-btn:hover { background: #218838; }
        .empty-cart { text-align: center; font-size: 18px; margin: 50px 0; color: #777; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo"><a href="index.html">Книгарня<span>.</span></a></div>
            <nav class="main-nav">
                <a href="index.html">Каталог</a>
                <a href="cart.html" class="active cart-link">Кошик (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <h1 class="section-title">Ваш кошик</h1>
        <div id="cart-container">
            </div>
    </main>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/header.js"></script>     
    <script src="js/cart.js"></script>
</body>
</html>
