<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - Онлайн-Книгарня</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .error-message {
            color: #c91818;
            margin-bottom: 15px;
            display: none; 
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                <a href="index.html">Книгарня<span>.</span></a>
            </div>
            <nav class="main-nav">
                <a href="index.html">Каталог</a>
                <a href="login.html" class="active">Увійти</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="auth-container">
            <h1 class="section-title" style="margin-bottom: 20px;">Вхід</h1>
            <p id="error-msg" class="error-message">Невірний email або пароль!</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-buy">Увійти</button>
            </form>
            <p style="margin-top: 15px; text-align: center;">
                Ще немає акаунта? <a href="register.html" style="color: #c91818;">Зареєструватися</a>
            </p>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
