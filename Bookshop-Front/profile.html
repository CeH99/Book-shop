<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій профіль - Онлайн-Книгарня</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo"><a href="index.html">Книгарня<span>.</span></a></div>
            <nav class="main-nav" id="main-nav">
                <a href="index.html">Каталог</a>
                <a href="cart.html" class="cart-link">Кошик (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="profile-dashboard">
            
            <div class="user-sidebar">
                <h2 id="greeting-title">Завантаження...</h2>
                
                <div class="user-info-group">
                    <div class="info-item">
                        <div class="info-label">Ім'я та Прізвище</div>
                        <div class="info-value">
                            <span id="profile-name">...</span> <span id="profile-surname">...</span>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Електронна пошта</div>
                        <div class="info-value" id="profile-email">...</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Номер телефону</div>
                        <div class="info-value" id="profile-phone">...</div>
                    </div>
                </div>
                
                <button class="btn-action" onclick="openEditModal()">📝 Редагувати дані</button>
                <button class="btn-action btn-logout" onclick="logoutUser(); return false;">🚪 Вийти з акаунту</button>
            </div>

            <div class="orders-container">
                <h2 style="margin-top: 0; margin-bottom: 25px;">📜 Історія замовлень</h2>
                <div id="orders-container">
                    <p style="color: #718096;">Завантаження замовлень...</p>
                </div>
            </div>
            
        </div>
    </main>

    <div id="editProfileModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top: 0; margin-bottom: 20px;">Редагувати профіль</h3>
            <form id="edit-profile-form">
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: 600; font-size: 14px;">Ім'я</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: 600; font-size: 14px;">Прізвище</label>
                    <input type="text" id="edit-surname" required>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: 600; font-size: 14px;">Електронна пошта</label>
                    <input type="email" id="edit-email" required>
                </div>
                <div style="margin-bottom: 25px;">
                    <label style="font-weight: 600; font-size: 14px;">Телефон</label>
                    <input type="tel" id="edit-phone" placeholder="+380...">
                </div>
                
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closeEditModal()" class="btn-action" style="width: auto; padding: 10px 15px; margin-top: 0;">Скасувати</button>
                    <button type="submit" style="padding: 10px 15px; border: none; background: #c91818; color: white; border-radius: 8px; cursor: pointer; font-weight: 600;">Зберегти</button>
                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/header.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
