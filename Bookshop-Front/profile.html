<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій профіль - Онлайн-Книгарня</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .order-card { border: 1px solid #eee; border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #fff; }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .order-status { font-weight: bold; padding: 5px 10px; border-radius: 4px; }
        .status-PENDING { background: #fff3cd; color: #856404; }
        .status-SHIPPED { background: #d4edda; color: #155724; }
        .order-items { list-style: none; padding: 0; }
        .order-items li { margin-bottom: 8px; color: #555; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo"><a href="index.html">Книгарня<span>.</span></a></div>
            <nav class="main-nav">
                <a href="index.html">Каталог</a>
                <a href="cart.html" class="cart-link">Кошик (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="main-content" style="max-width: 900px; margin: 40px auto; padding: 0 20px; color: #4a4a4a;">
        
        <h1 id="greeting-title" style="font-size: 28px; margin-bottom: 40px; color: #333;">Вітаємо!</h1>

        <section style="margin-bottom: 50px;">
            <h3 style="font-size: 20px; margin-bottom: 25px; color: #444;">Особисті дані</h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; row-gap: 20px; column-gap: 40px;">
                <div>
                    <div style="color: #888; font-size: 14px; margin-bottom: 5px;">Прізвище</div>
                    <div id="profile-surname" style="font-size: 16px; color: #222;">...</div>
                </div>
                <div>
                    <div style="color: #888; font-size: 14px; margin-bottom: 5px;">Електронна пошта</div>
                    <div id="profile-email" style="font-size: 16px; color: #222;">...</div>
                </div>
                <div>
                    <div style="color: #888; font-size: 14px; margin-bottom: 5px;">Ім'я</div>
                    <div id="profile-name" style="font-size: 16px; color: #222;">...</div>
                </div>
                <div>
                    <div style="color: #888; font-size: 14px; margin-bottom: 5px;">Телефон</div>
                    <div id="profile-phone" style="font-size: 16px; color: #222;">...</div>
                </div>
            </div>

            <!-- Profile actions -->
            <div style="display: flex; gap: 40px; margin-top: 30px;">
                <a href="#" onclick="openEditModal(); return false;" style="color: #3498db; text-decoration: none; font-size: 15px; transition: 0.2s;" onmouseover="this.style.color='#2980b9'" onmouseout="this.style.color='#3498db'">Редагувати дані</a>
                <a href="#" style="color: #3498db; text-decoration: none; font-size: 15px; transition: 0.2s;" onmouseover="this.style.color='#2980b9'" onmouseout="this.style.color='#3498db'">Змінити пароль</a>
                <a href="#" onclick="logoutUser(); return false;" style="color: #3498db; text-decoration: none; font-size: 15px; transition: 0.2s;" onmouseover="this.style.color='#2980b9'" onmouseout="this.style.color='#3498db'">Вихід</a>
            </div>
        </section>

        <!-- Recent orders -->
        <section>
            <h3 style="font-size: 20px; margin-bottom: 25px; color: #444;">Останні замовлення</h3>
            <div id="orders-container">
                <p>Завантаження історії...</p>
            </div>
        </section>

        <!-- Edit profile modal -->
        <div id="editProfileModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
            <div style="background: white; padding: 30px; border-radius: 8px; width: 400px; max-width: 90%; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
                <h3 style="margin-top: 0; margin-bottom: 20px; color: #333;">Редагувати профіль</h3>
                <form id="edit-profile-form">
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">Ім'я</label>
                        <input type="text" id="edit-name" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" required>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">Прізвище</label>
                        <input type="text" id="edit-surname" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" required>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">Електронна пошта</label>
                        <input type="email" id="edit-email" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" required>
                    </div>
                    <div style="margin-bottom: 25px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">Телефон</label>
                        <input type="tel" id="edit-phone" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" placeholder="+380...">
                    </div>
                    
                    <div style="display: flex; justify-content: flex-end; gap: 10px;">
                        <button type="button" onclick="closeEditModal()" style="padding: 10px 15px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-size: 14px;">Скасувати</button>
                        <button type="submit" style="padding: 10px 15px; border: none; background: #c91818; color: white; cursor: pointer; border-radius: 4px; font-size: 14px;">Зберегти</button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/header.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
