<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій профіль - Онлайн-Книгарня</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .order-card { border: 1px solid #eee; border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #fff; }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .order-status { font-weight: bold; padding: 5px 10px; border-radius: 4px; }
        .status-PENDING { background: #fff3cd; color: #856404; }
        .status-SHIPPED { background: #d4edda; color: #155724; }
        .order-items { list-style: none; padding: 0; }
        .order-items li { margin-bottom: 8px; color: #555; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo"><a href="index.html">Книгарня<span>.</span></a></div>
            <nav class="main-nav">
                <a href="index.html">Каталог</a>
                <a href="cart.html" class="cart-link">Кошик (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="main-content" style="max-width: 1200px; margin: 40px auto; padding: 0 20px;">
        <h1 class="section-title" style="margin-bottom: 30px;">Особистий кабінет</h1>
        
        <div style="display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap;">
            
            <aside style="flex: 0 0 300px; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border: 1px solid #eee;">
                <div style="font-size: 70px; margin-bottom: 15px; line-height: 1;">👤</div>
                <h2 id="profile-name" style="font-size: 22px; color: #222; margin-bottom: 10px;">Завантаження...</h2>
                <p id="profile-email" style="color: #666; font-size: 16px; margin-bottom: 25px;">...</p>
                
                <button onclick="openEditModal()" 
                        style="width: 100%; padding: 12px; border: 1px solid #c91818; background: white; color: #c91818; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;">
                    ⚙️ Редагувати профіль
                </button>
            </aside>

            <section style="flex: 1; min-width: 400px;">
                <div style="background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee;">
                    <h3 style="margin-top: 0; font-size: 20px; border-bottom: 2px solid #f5f5f5; padding-bottom: 15px; margin-bottom: 20px;">
                        📦 Ваші замовлення
                    </h3>
                    <div id="orders-container">
                        <p>Завантаження історії...</p>
                    </div>
                </div>
            </section>
        </div>
        <div id="editProfileModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
            <div style="background: white; padding: 30px; border-radius: 8px; width: 400px; max-width: 90%; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
                <h3 style="margin-top: 0; margin-bottom: 20px;">Редагувати профіль</h3>
                <form id="edit-profile-form">
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Ім'я</label>
                        <input type="text" id="edit-name" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Прізвище</label>
                        <input type="text" id="edit-surname" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Email</label>
                        <input type="email" id="edit-email" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" required>
                    </div>
                    <div style="margin-bottom: 25px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Телефон</label>
                        <input type="tel" id="edit-phone" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" placeholder="+380...">
                    </div>
                    
                    <div style="display: flex; justify-content: flex-end; gap: 10px;">
                        <button type="button" onclick="closeEditModal()" style="padding: 10px 15px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px;">Скасувати</button>
                        <button type="submit" style="padding: 10px 15px; border: none; background: #c91818; color: white; cursor: pointer; border-radius: 4px;">Зберегти</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
        </main>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/header.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
