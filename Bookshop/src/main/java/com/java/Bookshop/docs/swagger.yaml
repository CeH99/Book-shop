openapi: 3.0.3
info:
  title: Bookshop API
  description: API documentation for the Bookshop project
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequestDTO:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenResponseDTO:
      type: object
      properties:
        token:
          type: string

    UserRegistrationDTO:
      type: object
      required:
        - name
        - surname
        - email
        - password
      properties:
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        telephone:
          type: string
          pattern: '^\+?[0-9]{10,15}$'
        password:
          type: string
          minLength: 8

    UserResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email

    UserUpdateDTO:
      type: object
      required:
        - name
        - surname
        - email
      properties:
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        telephone:
          type: string

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    ProductRequestDTO:
      type: object
      required:
        - title
        - price
        - stockQuantity
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        stockQuantity:
          type: integer
        imageKey:
          type: string
        categoryId:
          type: integer
          format: int64
        author:
          type: string
        discount:
          type: integer

    ProductResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        stockQuantity:
          type: integer
        imageUrl:
          type: string
        categoryName:
          type: string
        author:
          type: string
        discount:
          type: integer
        averageRating:
          type: number
          format: double

    OrderRequestDTO:
      type: object
      required:
        - items
        - deliveryAddress
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequestDTO'
        deliveryAddress:
          type: string

    OrderItemRequestDTO:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer

    OrderResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        totalPrice:
          type: number
          format: decimal
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, COMPLETED, CANCELLED, PAID]
        listOfItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponseDTO'
        deliveryAddress:
          type: string

    OrderItemResponseDTO:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        name:
          type: string
        quantity:
          type: integer
        price:
          type: number
          format: decimal
        imageKey:
          type: string

    ReviewRequestDTO:
      type: object
      required:
        - productId
        - text
        - rating
      properties:
        productId:
          type: integer
          format: int64
        text:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5

    ReviewResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        rating:
          type: integer
        createdAt:
          type: string
          format: date-time
        userName:
          type: string

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationDTO'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'

  /api/auth/login:
    post:
      summary: Login and get JWT token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseDTO'

  /api/categories:
    get:
      summary: Get all categories
      tags: [Categories]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      summary: Add a new category
      tags: [Categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /api/categories/{id}:
    put:
      summary: Update a category
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      summary: Delete a category
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content

  /api/products:
    get:
      summary: Get all products
      tags: [Products]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          schema:
            type: string
            default: 'id,desc'
        - name: search
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
        - name: author
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductResponseDTO'
                  totalPages:
                    type: integer
                  totalElements:
                    type: integer
    post:
      summary: Add a new product
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequestDTO'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseDTO'

  /api/products/authors:
    get:
      summary: Get all authors
      tags: [Products]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/products/{productId}:
    get:
      summary: Get product by ID
      tags: [Products]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseDTO'
    put:
      summary: Update a product
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseDTO'
    delete:
      summary: Delete a product
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content

  /api/products/banner:
    get:
      summary: Get banner product
      tags: [Products]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseDTO'
        '204':
          description: No Content

  /api/products/banner/{productId}:
    put:
      summary: Set banner product
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/orders:
    get:
      summary: Get all orders
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponseDTO'
    post:
      summary: Create a new order
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequestDTO'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseDTO'

  /api/orders/user/{userId}:
    get:
      summary: Get orders for a specific user
      tags: [Orders]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponseDTO'

  /api/orders/{orderId}/status:
    patch:
      summary: Update order status
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: newStatus
          in: query
          required: true
          schema:
            type: string
            enum: [PENDING, COMPLETED, CANCELLED, PAID]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseDTO'

  /api/orders/my:
    get:
      summary: Get current user's orders
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponseDTO'

  /api/orders/pay:
    get:
      summary: Process payment
      tags: [Orders]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns HTML status page
          content:
            text/html:
              schema:
                type: string

  /api/orders/{orderId}/cancel:
    patch:
      summary: Cancel an order
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseDTO'

  /api/users/me:
    get:
      summary: Get current user info
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    put:
      summary: Update current user info
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  /api/users/check-admin:
    get:
      summary: Check if user is admin
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK

  /api/wishlist:
    get:
      summary: Get current user's wishlist
      tags: [Wishlist]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponseDTO'

  /api/wishlist/{productId}:
    post:
      summary: Add product to wishlist
      tags: [Wishlist]
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
    delete:
      summary: Remove product from wishlist
      tags: [Wishlist]
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK

  /api/reviews/product/{productId}:
    get:
      summary: Get reviews for a product
      tags: [Reviews]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponseDTO'

  /api/reviews:
    get:
      summary: Get all reviews
      tags: [Reviews]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponseDTO'
    post:
      summary: Add a review
      tags: [Reviews]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequestDTO'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponseDTO'

  /api/reviews/{id}:
    delete:
      summary: Delete a review
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content

  /api/files/upload:
    post:
      summary: Upload an image
      tags: [Files]
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
