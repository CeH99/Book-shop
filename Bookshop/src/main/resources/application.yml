server:
  port: 8080

spring:
  application:
    name: bookshop-api

  datasource:
    url: jdbc:postgresql://bookshop-db.c9k442wayuri.eu-north-1.rds.amazonaws.com:5432/bookshop_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}

aws.s3.bucket-name:
  coursework-bookshop-images

aws.s3.region:
  eu-north-1

